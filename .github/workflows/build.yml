name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: "25"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: utilities-scarce
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error

      # Also park the jar on an orphan "dist" branch, so it can be downloaded
      # as a plain file over git or raw.githubusercontent.com rather than only
      # as a zipped Actions artifact.
      - name: Publish jar to dist branch
        run: |
          set -eu
          jar=$(ls build/libs/*.jar | grep -v -- '-sources' | head -1)
          echo "Publishing $jar"
          work=$(mktemp -d)
          cp "$jar" "$work/"
          cd "$work"
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jar built from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
