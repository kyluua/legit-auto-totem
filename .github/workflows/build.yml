name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 26.2 compiles at release 25; 1.21.11 at release 21. The last entry
      # becomes the default JAVA_HOME, so the root build gets 25.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for 26.2
        run: ./gradlew build --stacktrace

      # The filtered compiler output ships alongside the jars, so a failure can
      # be read without pulling the whole run log.
      - name: Build for 1.21.11
        id: build_1_21_11
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: |
          set +e
          mkdir -p dist
          ./gradlew -p versions/1.21.11 build --console=plain > /tmp/build-1-21-11.log 2>&1
          status=$?
          {
            echo "=== gradle exit: $status ==="
            # Gradle buries compiler output under a long stack trace; keep just
            # the useful lines.
            grep -E "error:|warning:|cannot find symbol|symbol:|location:|required:|found:|reason:|^> Task|BUILD (FAILED|SUCCESSFUL)" \
              /tmp/build-1-21-11.log
          } > dist/1.21.11-build.txt
          head -60 dist/1.21.11-build.txt
          exit $status

      - name: Collect jars
        if: always()
        run: |
          set -eu
          mkdir -p dist
          for dir in build/libs versions/1.21.11/build/libs; do
            [ -d "$dir" ] || continue
            for jar in "$dir"/*.jar; do
              [ -e "$jar" ] || continue
              case "$jar" in
                *-sources.jar) continue ;;
              esac
              cp "$jar" dist/
            done
          done
          ls -l dist
          # Both versions must have produced a jar.
          test -e dist/utilities-scarce-1.0.0.jar
          test -e dist/utilities-scarce-1.21.11-1.0.0.jar

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: utilities-scarce
          path: dist/*
          if-no-files-found: error

      # Also park the jars on an orphan "dist" branch, so they can be
      # downloaded as plain files over git rather than as a zipped artifact.
      - name: Publish jars to dist branch
        if: always()
        run: |
          set -eu
          work=$(mktemp -d)
          cp dist/* "$work/"
          cd "$work"
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Built from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
