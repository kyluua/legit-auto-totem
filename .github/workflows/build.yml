name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # 26.2 compiles at release 25; 1.21.11 at release 21. The last entry
      # becomes the default JAVA_HOME, so the root build gets 25.
      - name: Set up JDKs
        uses: actions/setup-java@v4
        with:
          java-version: |
            21
            25
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build for 26.2
        run: ./gradlew build --stacktrace

      # Non-blocking: the 1.21.11 toolchain is currently broken upstream (see
      # versions/1.21.11/README.md). A failure there must not stop the 26.2 jar
      # from shipping.
      - name: Build for 1.21.11
        id: build_1_21_11
        continue-on-error: true
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_21_X64 }}
        run: ./gradlew -p versions/1.21.11 build --stacktrace

      - name: Collect jars
        run: |
          set -eu
          mkdir -p dist
          for dir in build/libs versions/1.21.11/build/libs; do
            [ -d "$dir" ] || continue
            for jar in "$dir"/*.jar; do
              [ -e "$jar" ] || continue
              case "$jar" in
                *-sources.jar) continue ;;
              esac
              cp "$jar" dist/
            done
          done
          ls -l dist
          # The 26.2 jar is the one that must always exist.
          ls dist/*.jar >/dev/null

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: utilities-scarce
          path: dist/*.jar
          if-no-files-found: error

      # Also park the jars on an orphan "dist" branch, so they can be
      # downloaded as plain files over git rather than as a zipped artifact.
      - name: Publish jars to dist branch
        run: |
          set -eu
          work=$(mktemp -d)
          cp dist/*.jar "$work/"
          cd "$work"
          git init -q
          git checkout -q -b dist
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Jars built from ${GITHUB_SHA}"
          git push -q --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
