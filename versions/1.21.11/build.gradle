plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// No mappings line: 1.21.11 ships non-obfuscated, so its Mojang names are
	// already the real ones and Loom refuses to be told to remap to them.
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Only the Fabric API modules this mod actually uses, rather than the whole
	// bundle. Several bundled modules -- fabric-biome-api-v1 among them --
	// declare access wideners in the intermediary namespace, which Loom refuses
	// to apply to a non-obfuscated game, and that failure kills the build even
	// though this mod never touches those modules. None of the four below
	// carries one. Non-transitive so none creeps back in.
	["fabric-api-base",
	 "fabric-key-binding-api-v1",
	 "fabric-events-interaction-v0",
	 "fabric-rendering-v1"].each { moduleName ->
		implementation(fabricApi.module(moduleName, project.fabric_api_version)) {
			transitive = false
		}
	}

	// No Cloth Config on this build, so no settings screen; see ConfigScreens.
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}
}

processResources {
	def modVersion = project.mod_version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version

	inputs.property "version", modVersion
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_version": minecraftVersion,
				"loader_version": loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("../../LICENSE") {
		rename { "${it}_utilities-scarce" }
	}
}
