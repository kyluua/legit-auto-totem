plugins {
	// 1.21.11 still ships an obfuscated client, so this build needs the
	// remapping flavour of Loom. The plain 'net.fabricmc.fabric-loom' plugin
	// used by the 26.2 build only handles the non-obfuscated jars Mojang
	// started shipping later: point it at 1.21.11 and it hands javac the
	// obfuscated classes, so nothing under net.minecraft resolves.
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	// Mod Menu -- provides the "Config" button next to the mod in the mod list.
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	// Cloth Config -- builds the settings screen itself.
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Both integrations are optional at runtime -- see ModMenuIntegration and
	// ClothConfigScreenFactory, which are only touched when the mods are
	// present.
	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}

	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
}

processResources {
	def modVersion = project.mod_version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version

	inputs.property "version", modVersion
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_version": minecraftVersion,
				"loader_version": loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("../../LICENSE") {
		rename { "${it}_utilities-scarce" }
	}
}
