plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	// 1.21.11 predates Loom defaulting to Mojang mappings, so ask for them.
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modCompileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}
	modLocalRuntime("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}

	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
	modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: 'net.fabricmc.fabric-api')
	}
}

processResources {
	def modVersion = project.mod_version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version

	inputs.property "version", modVersion
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_version": minecraftVersion,
				"loader_version": loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("../../LICENSE") {
		rename { "${it}_utilities-scarce" }
	}
}
