plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven {
		name = 'TerraformersMC'
		url = 'https://maven.terraformersmc.com/'
	}
	maven {
		name = 'shedaniel'
		url = 'https://maven.shedaniel.me/'
	}
}

dependencies {
	// No mappings line: 1.21.11 ships non-obfuscated, so the Mojang names are
	// already the real ones and Loom refuses to be told to remap to them.
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// No Cloth Config here: its 1.21.11 release declares an access widener in
	// the intermediary namespace, and 1.21.11 ships non-obfuscated, so Loom
	// refuses to apply it. This build configures from JSON and hotkeys instead.
	compileOnly("com.terraformersmc:modmenu:${project.modmenu_version}") {
		transitive(false)
	}
}

processResources {
	def modVersion = project.mod_version
	def minecraftVersion = project.minecraft_version
	def loaderVersion = project.loader_version

	inputs.property "version", modVersion
	inputs.property "minecraft_version", minecraftVersion
	inputs.property "loader_version", loaderVersion

	filesMatching("fabric.mod.json") {
		expand "version": modVersion,
				"minecraft_version": minecraftVersion,
				"loader_version": loaderVersion
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	from("../../LICENSE") {
		rename { "${it}_utilities-scarce" }
	}
}
