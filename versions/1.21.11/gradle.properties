org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

# Fabric properties -- check these on https://fabricmc.net/develop
minecraft_version=1.21.11
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.141.6+1.21.11

# Mod properties
mod_version=1.0.0
maven_group=dev.kyluua
archives_base_name=utilities-scarce-1.21.11

# Both optional integrations are compile-only: the mod runs without them, it
# just cannot show a settings screen.
modmenu_version=17.0.1-beta.1
# Cloth Config publishes as <mc_version without the leading 1.>.<build>, so
# 1.21.11 releases are the 21.11 line. Pin it if you want a reproducible build.
cloth_config_version=21.11.+
