# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see:
# https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Fabric properties -- check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17-SNAPSHOT
fabric_api_version=0.158.0+26.2

# Mod properties
mod_version=1.0.0
maven_group=dev.kyluua
archives_base_name=utilities-scarce

# Optional integrations. Both are compile-only: the mod runs without them,
# it just cannot show a settings screen.
# Mod Menu 20.0.1 is the 26.2 release: https://maven.terraformersmc.com/
modmenu_version=20.0.1
# Cloth Config publishes as <mc_version>.<ci build number>, so the exact patch
# number moves. Pin it if you want a reproducible build.
cloth_config_version=26.2.+
